<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070f0a" />

    <!--
      Runs before the module bundle, which is deferred. ScrollTrigger caches whatever
      history.scrollRestoration holds when it initialises and writes that value back later, and ES
      imports evaluate the whole dependency graph before any statement in main.tsx — so setting
      this from application code is always too late to win. The site always opens on the hero.
    -->
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);
    </script>
    <title>Ashav Parihar — Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Ashav Parihar, a software engineer specializing in React, TypeScript, and Python. Case studies, projects, and contact info."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ashav Parihar — Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Ashav Parihar, a software engineer specializing in React, TypeScript, and Python."
    />
    <meta property="og:url" content="https://ashavparihar.me" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ashav Parihar — Software Engineer" />
    <meta
      name="twitter:description"
      content="Portfolio of Ashav Parihar, a software engineer specializing in React, TypeScript, and Python."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
